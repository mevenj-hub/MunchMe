<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Munch Me</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#10b981" />
  <style>
    /* Splash Screen Styling */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease-out;
    }
    .splash-logo {
      width: 96px;
      height: 96px;
      margin-bottom: 16px;
      animation: pulse 1.5s infinite ease-in-out;
    }
    .splash-title {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: #111827;
      margin: 0;
    }
    .splash-slogan {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      color: #6b7280;
      margin-top: 6px;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.85; }
    }
  </style>
</head>
<body>
  <!-- Startup Splash Screen -->
  <div id="splash-screen">
    <img src="/assets/icon-192.png" alt="Munch Me Logo" class="splash-logo" />
    <h1 class="splash-title">Munch Me</h1>
    <p class="splash-slogan">Smart Nutrition & Personal Meal Planning</p>
  </div>

  <div id="root"></div>

  <script>
    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('Service Worker registered!', reg))
          .catch(err => console.log('Service Worker registration failed:', err));
      });
    }

    // Hide Splash Screen once app mounts
    window.addEventListener('DOMContentLoaded', () => {
      const splash = document.getElementById('splash-screen');
      if (splash) {
        setTimeout(() => {
          splash.style.opacity = '0';
          setTimeout(() => splash.remove(), 400);
        }, 500); // Adjust delay as needed for asset loading
      }
    });
  </script>
</body>
</html>
